<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareSync - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 8px;
            font-size: 30px;
            font-weight: bold;
            color: #173f6b;
        }

        .subtitle {
            text-align: center;
            color: #687386;
            margin-bottom: 28px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #263238;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #d1d9e6;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #1976d2;
            box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.12);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1976d2;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #125ea8;
        }

        button:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
        }

        .error {
            display: none;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #ffebee;
            color: #c62828;
            font-size: 13px;
        }

        .success {
            display: none;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 13px;
        }
        /* MASTER DASHBOARD DESIGN TOKENS */
        :root { --gray-800:#243b53; --gray-600:#627d98; --gray-200:#d9e2ec; --gray-50:#f5f7fa; --blue-600:#2176b5; --blue-700:#1769aa; }
        body { background:var(--gray-50); color:var(--gray-800); font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
        .login-container { max-width:380px; padding:28px; border:1px solid var(--gray-200); border-radius:6px; box-shadow:0 1px 3px rgba(16,42,67,.05); }
        .logo { color:#173f63; font-size:26px; }
        .subtitle { color:var(--gray-600); font-size:12px; }
        label { color:var(--gray-800); font-size:12px; }
        input { border:1px solid var(--gray-200); border-radius:5px; font-size:12px; }
        input:focus { border-color:var(--blue-600); }
        button { border-radius:4px; background:var(--blue-600); font-size:12px; font-weight:600; }
        button:hover { background:var(--blue-700); }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">CareSync</div>

    <div class="subtitle">
        Smart Healthcare Management
    </div>

    <div id="errorMessage" class="error"></div>

    <div id="successMessage" class="success"></div>

    <form id="loginForm">

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit" id="loginButton">
            Login
        </button>

    </form>

</div>

<script>

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");

    const errorMessage = document.getElementById("errorMessage");
    const successMessage = document.getElementById("successMessage");


    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        errorMessage.style.display = "none";
        successMessage.style.display = "none";

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";


        try {

            const response = await fetch(
                "/caresync/api/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );


            const responseText = await response.text();

            let data;

            try {
                data = JSON.parse(responseText);
            } catch (e) {
                data = null;
            }


            if (!response.ok) {

                errorMessage.textContent =
                    data || "Invalid email or password.";

                errorMessage.style.display = "block";

                loginButton.disabled = false;
                loginButton.textContent = "Login";

                return;
            }


            if (!data || !data.token) {

                errorMessage.textContent =
                    "Login succeeded but no authentication token was received.";

                errorMessage.style.display = "block";

                loginButton.disabled = false;
                loginButton.textContent = "Login";

                return;
            }


            const token = data.token;


            /*
             * Store JWT so the rest of the CareSync
             * application can use it.
             */
            localStorage.setItem("caresyncToken", token);


            /*
             * Decode the JWT payload.
             *
             * JwtService puts:
             *   subject = email
             *   role = PATIENT / CAREGIVER / ...
             */
            const payload =
                JSON.parse(
                    atob(
                        token
                            .split(".")[1]
                            .replace(/-/g, "+")
                            .replace(/_/g, "/")
                    )
                );


            const role = payload.role;


            if (!role) {

                errorMessage.textContent =
                    "Login succeeded but user role was not found.";

                errorMessage.style.display = "block";

                loginButton.disabled = false;
                loginButton.textContent = "Login";

                return;
            }


            /*
             * Save useful user information.
             */
            localStorage.setItem(
                "caresyncEmail",
                email
            );

            localStorage.setItem(
                "caresyncRole",
                role
            );


            successMessage.textContent =
                "Login successful. Redirecting...";

            successMessage.style.display = "block";


            /*
             * Redirect based on role.
             */
            if (role === "PATIENT") {

                window.location.href =
                    "/caresync/patient/dashboard";

            } else if (role === "CAREGIVER") {

                window.location.href =
                    "/caresync/caregiver/dashboard";

            } else {

                /*
                 * For future roles such as
                 * DOCTOR or ADMIN.
                 */
                errorMessage.textContent =
                    "Login successful, but this role does not have a dashboard yet: "
                    + role;

                errorMessage.style.display = "block";

                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }

        } catch (error) {

            console.error(error);

            errorMessage.textContent =
                "Unable to connect to the CareSync server.";

            errorMessage.style.display = "block";

            loginButton.disabled = false;
            loginButton.textContent = "Login";
        }

    });

</script>

</body>
</html>
